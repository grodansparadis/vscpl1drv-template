name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Built on Debian bookworm so the driver runs on Debian 12, Ubuntu 22.04
      # and newer.
      - name: Build, test and install
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            debian:bookworm \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential cmake git python3 pandoc ca-certificates
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build --parallel "$(nproc)"
              ctest --test-dir build --output-on-failure
              DESTDIR=/src/staging cmake --install build
              tar -C /src/staging -czf /src/vscpl1drv-template-linux-x86_64.tar.gz .
            '

      - name: Write SHA256SUMS
        id: sha256sums
        continue-on-error: true
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE//\\//}/.github/scripts/write-sha256sums.sh" "SHA256SUMS-vscpl1drv-template-linux-x86_64" <<'SHA256SUMS_PATTERNS'
          vscpl1drv-template-linux-x86_64.tar.gz
          SHA256SUMS_PATTERNS

      - uses: actions/upload-artifact@v7
        with:
          name: vscpl1drv-template-linux-x86_64
          path: |
            vscpl1drv-template-linux-x86_64.tar.gz
            ${{ steps.sha256sums.outputs.file }}
          if-no-files-found: error
